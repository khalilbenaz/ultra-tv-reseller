name: Pro release

# Édition Pro (variante revendeur avec licence) — dépôt PRIVÉ uniquement.
# Tag `pro-vX.Y.Z` (= VERSION) ou lancement manuel : construit Android (APK par ABI, signés avec la clé Pro)
# et le bureau (macOS universel, Windows x64, Linux x64), puis dépose les fichiers en artefacts.
# La publication dans le dépôt de distribution public khalilbenaz/ultra-tv-pro se fait ensuite
# (scripts/publish-pro.sh), car le jeton de ce dépôt ne peut pas écrire dans un autre dépôt.

on:
  push:
    tags:
      - "pro-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (Pro)
    if: github.repository == 'khalilbenaz/ultra-tv-reseller'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: chmod +x gradlew && ./gradlew testDebugUnitTest -PULTRA_EDITION=pro --console=plain

      - name: Build release (édition Pro)
        run: ./gradlew assembleRelease -PULTRA_EDITION=pro --console=plain --stacktrace

      - name: Signature avec la clé Pro + noms de distribution
        env:
          PRO_KEYSTORE_BASE64: ${{ secrets.PRO_KEYSTORE_BASE64 }}
          PRO_KEYSTORE_PASSWORD: ${{ secrets.PRO_KEYSTORE_PASSWORD }}
          PRO_KEY_ALIAS: ${{ secrets.PRO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$PRO_KEYSTORE_BASE64" || { echo "::error::Secrets PRO_* absents"; exit 1; }
          echo "$PRO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pro.keystore"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          V=$(cat ../VERSION)
          OUT="$GITHUB_WORKSPACE/dist-android"; mkdir -p "$OUT"
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk" .apk)              # app-arm64-v8a-release, app-universal-release
            abi=${base#app-}; abi=${abi%-release}
            if [ "$abi" = "universal" ]; then name="UltraTVPro-universal.apk"; else name="UltraTVPro-$V-$abi.apk"; fi
            "$SIGNER" sign --ks "$RUNNER_TEMP/pro.keystore" --ks-pass env:PRO_KEYSTORE_PASSWORD --ks-key-alias "$PRO_KEY_ALIAS" \
              --key-pass env:PRO_KEYSTORE_PASSWORD --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "$OUT/$name" "$apk"
            # Garde-fou : jamais d'APK signé avec la clé de débogage.
            "$SIGNER" verify --print-certs "$OUT/$name" | tee /dev/stderr | grep -q "CN=Ultra TV Pro" || { echo "::error::$name n'est pas signé avec la clé Pro"; exit 1; }
          done
          rm -f "$RUNNER_TEMP/pro.keystore"
          cd "$OUT"
          # Noms stables pour la page de téléchargement du Worker (/download).
          cp "UltraTVPro-$V-arm64-v8a.apk" UltraTVPro-arm64-v8a.apk
          cp "UltraTVPro-$V-armeabi-v7a.apk" UltraTVPro-armeabi-v7a.apk
          sha256sum UltraTVPro-universal.apk > UltraTVPro-universal.apk.sha256
          sha256sum UltraTVPro-*.apk > SHA256SUMS.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: pro-android
          path: dist-android/*
          retention-days: 14

  desktop:
    name: Desktop ${{ matrix.name }} (Pro)
    if: github.repository == 'khalilbenaz/ultra-tv-reseller'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, target: mac }
          - { name: Windows, os: windows-latest, target: win }
          - { name: Linux, os: ubuntu-latest, target: linux }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json
      - name: Version = VERSION
        run: |
          V=$(cat VERSION)
          (cd electron && npm version "$V" --no-git-tag-version --allow-same-version)
      - name: Web (édition Pro)
        working-directory: web
        env:
          VITE_EDITION: pro
        run: npm ci && npm test && npm run build
      - name: Electron
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm ci && npm test && npm run package:pro:${{ matrix.target }}
      - name: Noms stables
        working-directory: electron/release
        run: |
          V=$(cat ../../VERSION)
          [ -f "UltraTVPro-$V-win-x64.exe" ] && cp "UltraTVPro-$V-win-x64.exe" UltraTVPro-win-x64.exe || true
          [ -f "UltraTVPro-$V-mac-universal.dmg" ] && cp "UltraTVPro-$V-mac-universal.dmg" UltraTVPro-mac-universal.dmg || true
          [ -f "UltraTVPro-$V-linux-x86_64.AppImage" ] && cp "UltraTVPro-$V-linux-x86_64.AppImage" UltraTVPro-linux-x86_64.AppImage || true
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: pro-desktop-${{ matrix.target }}
          path: |
            electron/release/*.exe
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.AppImage
            electron/release/*.blockmap
            electron/release/latest*.yml
          retention-days: 14
